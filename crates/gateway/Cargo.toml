[package]
name = "pennyrouter-gateway"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[lib]
name = "pennyrouter_gateway"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
# Upstream forwarder. rustls (bundled roots) keeps the Docker image free of
# OpenSSL build deps and system CA installs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
