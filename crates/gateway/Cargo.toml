[package]
name = "pennyrouter-gateway"
version = "0.11.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[lib]
name = "pennyrouter_gateway"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
# Upstream forwarder. rustls (bundled roots) keeps the Docker image free of
# OpenSSL build deps and system CA installs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Decode gzipped upstream error bodies (Iter 20). Pure-Rust backend,
# like rustls — no C deps in the image.
flate2 = "1"
# Routing snapshot format (Iter 5): the gateway reads the catalog DB
# artifact the sync process publishes.
pennyrouter-catalog = { path = "../catalog" }
# RFC 3339 timestamps (same version as the catalog crate): parsing
# for the B18 ranking-staleness gate, formatting for the Iter 37
# sessions tab. Declared here (not inherited from the catalog
# crate) so the shipped binary never depends on transitive features.
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
