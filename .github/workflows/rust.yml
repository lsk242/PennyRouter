name: Rust

on:
  push:
  pull_request:

jobs:
  test:
    name: Test, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  catalog-image:
    name: Catalog image build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.catalog
          load: true
          push: false
          tags: pennyrouter-catalog:ci
      - name: One-shot sync smoke test
        run: |
          docker volume create catalog-ci
          docker run --rm -v catalog-ci:/catalog \
            -v "$PWD/crates/catalog/tests/fixtures:/input:ro" \
            pennyrouter-catalog:ci
          docker run --rm -v catalog-ci:/catalog:ro debian:bookworm-slim \
            sh -c 'ls /catalog/*.manifest.json'
