name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image names (lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
          echo "CATALOG_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-catalog:latest" >> "$GITHUB_ENV"
      - name: Validate deploy composes are pull-only
        run: |
          for f in compose.prod.yaml compose.dev.yaml; do
            docker compose -f "$f" config --quiet
            if docker compose -f "$f" config | grep -q 'build:'; then
              echo "$f must not contain a build section" >&2
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - name: Smoke test /health
        run: |
          docker run -d --name gw -p 3000:3000 "${IMAGE}"
          sleep 2
          curl -fsS http://localhost:3000/health
          docker stop gw
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.catalog
          load: true
          push: false
          tags: ${{ env.CATALOG_IMAGE }}
      - name: Smoke test catalog one-shot
        run: |
          docker volume create catalog-ci
          docker run --rm -v catalog-ci:/catalog "${CATALOG_IMAGE}"
          docker run --rm -v catalog-ci:/catalog:ro debian:bookworm-slim \
            sh -c 'ls /catalog/*.manifest.json'
      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE}"
          docker push "${CATALOG_IMAGE}"
