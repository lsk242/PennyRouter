# Local development: builds the image from source and runs it.
# Usage (from the repo root):
#   cp -n .env.example .env   # once; optional, defaults work without it
#   docker compose up --build
# The catalog-sync service writes versioned DB artifacts to the shared
# catalog-data volume, which the gateway mounts read-only.
services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IMAGE:-pennyrouter:dev}
    container_name: gateway
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    # Lets the container reach host-run mocks (perf comparison) via
    # http://host.docker.internal:<port>. Harmless for normal dev.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT:-3000}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      MODAL_BASE_URL: ${MODAL_BASE_URL:-}
      BASETEN_BASE_URL: ${BASETEN_BASE_URL:-https://inference.baseten.co}
      GATEWAY_UI: ${GATEWAY_UI:-}
      CATALOG_DB: ${CATALOG_DB:-/catalog}
    volumes:
      - catalog-data:/catalog:ro
  catalog-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.catalog
    image: ${CATALOG_IMAGE:-pennyrouter-catalog:dev}
    volumes:
      - catalog-data:/catalog
      # Fixture input until live fetching lands.
      - ./crates/catalog/tests/fixtures:/input:ro
    environment:
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      FETCH_OPENROUTER: ${FETCH_OPENROUTER:-0}
    restart: unless-stopped
  # Opt-in catalog browser (Iter 17): only starts with
  #   docker compose --profile ui up catalog-ui
  # then open http://localhost:${CATALOG_UI_PORT:-8080} in a browser.
  catalog-ui:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: docker/Dockerfile.catalog
    image: ${CATALOG_IMAGE:-pennyrouter-catalog:dev}
    command: ["catalog-ui", "--dir", "/catalog"]
    ports:
      - "${CATALOG_UI_PORT:-8080}:8080"
    volumes:
      - catalog-data:/catalog:ro
    environment:
      CATALOG_UI: "1"
      PORT: "8080"

volumes:
  catalog-data:
